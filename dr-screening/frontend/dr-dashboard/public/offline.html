<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RetinAI — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #F0F7FA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(27, 147, 197, 0.1);
      border: 1px solid #B9DCED;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { color: #0A3347; font-size: 22px; margin-bottom: 8px; font-weight: 800; }
    p  { color: #64748b; font-size: 14px; line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 20px;
      background: #F0F7FA;
      color: #1B93C5;
      border: 1px solid #B9DCED;
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 700;
    }
    .retry {
      margin-top: 20px;
      display: block;
      background: #1B93C5;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 14px rgba(27, 147, 197, 0.3);
      transition: all 0.2s;
    }
    .retry:hover { background: #167CA7; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      No internet connection detected.<br />
      Images captured will be saved and automatically
      synced when you reconnect.
    </p>
    <span class="badge">RetinAI Screening Platform</span>
    <button class="retry" onclick="window.location.reload()">
      ↺ Try Again
    </button>
  </div>
</body>
</html>
